plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.roborazzi)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace = 'com.onefishtwo.bbqtimer'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.onefishtwo.bbqtimer"
        versionCode = 26
        versionName = '5.0'
        minSdk = 24
        targetSdk = 37

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        localeFilters += ['en', 'de']
    }

    installation {
        installOptions = ['-r', '-d']
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions = ["store"]

    signingConfigs {
        playRelease {
            def storeFilePath = System.getenv('PLAY_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('PLAY_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('PLAY_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('PLAY_RELEASE_KEY_PASSWORD')
            }
        }
        izzyRelease {
            def storeFilePath = System.getenv('IZZY_RELEASE_STORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('IZZY_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('IZZY_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('IZZY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    productFlavors {
        play {
            dimension "store"
            isDefault = true
            def playSigning = signingConfigs.playRelease
            signingConfig = (playSigning.storeFile != null) ? playSigning : signingConfigs.debug
        }
        izzy {
            dimension "store"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt', 'proguard-izzy.txt'
            def izzySigning = signingConfigs.izzyRelease
            signingConfig = (izzySigning.storeFile != null) ? izzySigning : signingConfigs.debug
        }
    }

    buildTypes {
        debug {
            isDefault = true
            // Enable StrictMode for debug builds
            buildConfigField "boolean", "ENABLE_STRICT_MODE", "true"
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            minifyEnabled true
            shrinkResources = true
            // Disable StrictMode for release builds
            buildConfigField "boolean", "ENABLE_STRICT_MODE", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        // Workaround: ANDROIDX_TEST_ORCHESTRATOR spawns a new OS process for each @Test method.
        // This copes with leaks of graphics resources and memory that can crash the emulator and
        // take out logcat output with it.
        //
        // ANDROIDX_TEST_ORCHESTRATOR enables `clearPackageData: 'true'`, which clears the package
        // state over ADB sockets before each test, flooding adbd and crashing system_server.
        // So use ApplicationState.resetForTests() instead.
        execution = 'ANDROIDX_TEST_ORCHESTRATOR'
        unitTests {
            includeAndroidResources = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(["-Xlint:unchecked", "-Xlint:deprecation"])
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.dynamicanimation
    implementation libs.material
    implementation libs.gms.play.services.wearable

    testImplementation libs.junit
    testImplementation libs.androidx.junit
    testImplementation libs.androidx.espresso.core
    testImplementation libs.core
    testImplementation libs.roborazzi
    testImplementation libs.roborazzi.junit.rule
    testImplementation libs.robolectric
    // Roborazzi's Espresso support can require Compose UI Test for its internal overloads
    testImplementation libs.compose.ui.test

    // See https://developer.android.com/training/testing/set-up-project for more.
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.core
    androidTestImplementation libs.androidx.rules
    androidTestImplementation libs.uiautomator
    androidTestImplementation libs.roborazzi
    androidTestImplementation libs.roborazzi.junit.rule

    // See https://github.com/android/android-test/issues/1042
    androidTestUtil libs.androidx.orchestrator
}
